<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent Car — ระบบเช่ารถออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171A;
  --surface:#1C2024;
  --surface-2:#23282D;
  --surface-3:#2B3137;
  --line:#33393F;
  --line-soft:#282E33;
  --amber:#FFC94A;
  --amber-dark:#E0A82E;
  --blue:#5AAAFF;
  --text:#F2F3F4;
  --text-muted:#9AA3AB;
  --text-faint:#6B7278;
  --green:#3ECF8E;
  --green-dim:#1E3A2D;
  --orange:#FF9A4D;
  --orange-dim:#3A2C1E;
  --red:#FF5C6C;
  --red-dim:#3A1E22;
  --blue-dim:#1E2A3A;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 20% -10%, rgba(255,201,74,.05), transparent 60%),
    radial-gradient(900px 500px at 90% 10%, rgba(90,170,255,.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Noto Sans Thai','Space Mono',sans-serif;
  min-height:100vh;
}
h1,h2,h3,h4,.display{
  font-family:'Kanit','Noto Sans Thai',sans-serif;
  letter-spacing:.2px;
}
.num{ font-family:'Space Mono', monospace; }
a{color:var(--blue);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ===== Lane divider signature element ===== */
.lane-divider{
  height:3px;
  width:100%;
  background-image:repeating-linear-gradient(90deg, var(--amber) 0 22px, transparent 22px 40px);
  opacity:.55;
  border-radius:2px;
  margin:28px 0;
}

/* ===== Top sign nav ===== */
.signpost{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg, #171A1D 0%, #14171A 100%);
  border-bottom:1px solid var(--line);
  padding:0 20px;
}
.signpost-inner{
  max-width:1180px; margin:0 auto;
  display:flex; align-items:center; gap:18px;
  height:64px;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-weight:800; font-size:20px; color:var(--text);
  white-space:nowrap;
}
.brand .plate-dot{
  width:10px;height:10px;border-radius:2px;background:var(--amber);
  box-shadow:0 0 12px rgba(255,201,74,.7);
}
.navtabs{ display:flex; gap:6px; flex:1; overflow-x:auto; }
.navtab{
  border:1px solid transparent; background:transparent; color:var(--text-muted);
  padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600;
  white-space:nowrap; transition:.15s;
}
.navtab:hover{ color:var(--text); background:var(--surface-2); }
.navtab.active{ color:#14171A; background:var(--amber); }
.navuser{ display:flex; align-items:center; gap:10px; white-space:nowrap; }
.navuser .who{ font-size:13px; color:var(--text-muted); }
.navuser .who b{ color:var(--text); }
.btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--text);
  padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600;
  transition:.15s;
}
.btn:hover{ background:var(--surface-3); }
.btn-primary{ background:var(--amber); color:#14171A; border-color:var(--amber); }
.btn-primary:hover{ background:var(--amber-dark); }
.btn-ghost{ background:transparent; border-color:var(--line); }
.btn-danger{ background:var(--red-dim); color:var(--red); border-color:#4a2229; }
.btn-sm{ padding:6px 12px; font-size:12.5px; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }

.wrap{ max-width:1180px; margin:0 auto; padding:32px 20px 80px; }
.pagehead{ margin-bottom:6px; }
.pagehead h1{ font-size:28px; margin:0 0 6px; }
.pagehead p{ color:var(--text-muted); margin:0; font-size:14.5px; }

/* ===== Gauge stat cards ===== */
.gauges{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin:22px 0 6px; }
.gauge{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; display:flex; align-items:center; gap:14px;
}
.gauge svg{ flex-shrink:0; }
.gauge .g-label{ font-size:12px; color:var(--text-muted); }
.gauge .g-value{ font-size:22px; font-weight:700; font-family:'Space Mono',monospace; }

/* ===== Cards / grid ===== */
.grid-cars{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; margin-top:18px; }
.car-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; display:flex; flex-direction:column;
}
.car-top{
  height:150px; position:relative; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg, var(--surface-3), var(--surface-2));
  border-bottom:1px dashed var(--line);
}
.car-top svg{ width:88px; height:auto; opacity:.92; }
.car-img{ width:100%; height:100%; object-fit:cover; }
.plate{
  position:absolute; top:10px; right:10px; z-index:2;
  background:#F4D35E; color:#151515; border:2px solid #151515;
  border-radius:5px; padding:2px 7px; font-family:'Space Mono',monospace;
  font-size:11px; font-weight:700; letter-spacing:.5px;
}
.status-chip{
  position:absolute; top:10px; left:10px; z-index:2;
  border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700;
  display:flex; align-items:center; gap:5px;
}
.status-chip .dot{ width:6px;height:6px;border-radius:50%; }
.status-available{ background:var(--green-dim); color:var(--green); }
.status-available .dot{ background:var(--green); }
.status-reserved{ background:var(--blue-dim); color:var(--blue); }
.status-reserved .dot{ background:var(--blue); }
.status-rented{ background:var(--red-dim); color:var(--red); }
.status-rented .dot{ background:var(--red); }
.status-maintenance{ background:var(--orange-dim); color:var(--orange); }
.status-maintenance .dot{ background:var(--orange); }

.car-body{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
.car-body h3{ margin:0; font-size:16.5px; }
.car-meta{ display:flex; flex-wrap:wrap; gap:6px; }
.tag{ font-size:11px; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--line); padding:3px 8px; border-radius:6px; }
.car-price{ margin-top:auto; display:flex; align-items:baseline; justify-content:space-between; padding-top:8px; border-top:1px solid var(--line-soft); }
.car-price .amt{ font-family:'Space Mono',monospace; font-size:19px; font-weight:700; color:var(--amber); }
.car-price .per{ font-size:11.5px; color:var(--text-faint); }
.car-actions{ display:flex; gap:8px; margin-top:4px; }

/* ===== Forms / cards ===== */
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
.form-row.single{ grid-template-columns:1fr; }
.form-row.three{ grid-template-columns:1fr 1fr 1fr; }
label{ display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=tel],input[type=number],select,textarea{
  width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  padding:10px 12px; border-radius:var(--radius-sm); font-size:14px; outline:none;
}
input:focus,select:focus,textarea:focus{ border-color:var(--amber); }
.hint{ font-size:12px; color:var(--text-faint); margin-top:4px; }
.error-box{ background:var(--red-dim); border:1px solid #4a2229; color:#ffb2ba; padding:10px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:14px; }
.success-box{ background:var(--green-dim); border:1px solid #1f4a34; color:#9CF0C6; padding:10px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:14px; }

/* ===== Auth ===== */
.auth-wrap{ max-width:420px; margin:60px auto; }
.auth-toggle{ display:flex; gap:6px; margin-bottom:20px; background:var(--surface-2); padding:4px; border-radius:999px; }
.auth-toggle button{ flex:1; border:none; background:transparent; color:var(--text-muted); padding:9px; border-radius:999px; font-weight:600; font-size:13.5px; }
.auth-toggle button.active{ background:var(--amber); color:#14171A; }

/* ===== Table ===== */
table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; color:var(--text-muted); font-weight:600; font-size:12px; padding:10px 12px; border-bottom:1px solid var(--line); }
td{ padding:12px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
tr:last-child td{ border-bottom:none; }

/* ===== Price breakdown ===== */
.breakdown{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin-top:6px; }
.brow{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--text-muted); }
.brow.total{ color:var(--text); font-weight:700; font-size:16px; border-top:1px dashed var(--line); margin-top:6px; padding-top:10px; }
.brow .plus{ color:var(--green); }
.brow .minus{ color:var(--amber); }

/* ===== Promo badge ===== */
.promo-card{ background:linear-gradient(135deg, var(--surface-3), var(--surface-2)); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:relative; overflow:hidden; }
.promo-card::before{ content:""; position:absolute; right:-30px; top:-30px; width:100px; height:100px; background:radial-gradient(circle, rgba(255,201,74,.18), transparent 70%); }
.promo-card h3{ margin:0 0 6px; font-size:17px; color:var(--amber); }
.promo-card p{ margin:0; color:var(--text-muted); font-size:13.5px; line-height:1.6; }
.promo-badge{ display:inline-block; margin-top:10px; font-family:'Space Mono',monospace; font-size:12px; background:var(--amber); color:#14171A; padding:3px 10px; border-radius:6px; font-weight:700; }

/* ===== Empty state ===== */
.empty{ text-align:center; padding:50px 20px; color:var(--text-faint); }
.empty svg{ opacity:.4; margin-bottom:10px; }

/* ===== Tabs (secondary) ===== */
.subtabs{ display:flex; gap:8px; margin:18px 0; flex-wrap:wrap; }
.subtab{ background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; }
.subtab.active{ background:var(--surface-3); color:var(--text); border-color:var(--amber); }

/* ===== QR box ===== */
.qr-box{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px; }
.qr-image{ width:200px; height:200px; background:#fff; border-radius:8px; padding:8px; }

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px; }
.toast{ background:var(--surface-3); border:1px solid var(--line); border-left:4px solid var(--green); color:var(--text); padding:12px 18px; border-radius:var(--radius-sm); font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:slidein .2s ease; max-width:320px; }
.toast.err{ border-left-color:var(--red); }
@keyframes slidein{ from{ transform:translateX(20px); opacity:0; } to{ transform:translateX(0); opacity:1; } }

.footer-note{ text-align:center; color:var(--text-faint); font-size:12px; margin-top:60px; padding-top:20px; border-top:1px solid var(--line-soft); }

/* ===== Tracker Map Mockup ===== */
.map-container { position:relative; width:100%; height:320px; background:#242f3e; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line); margin-top:12px; }
.map-iframe { width:100%; height:100%; border:none; }
.rider-info-overlay { position:absolute; bottom:12px; left:12px; right:12px; background:rgba(28,32,36,0.95); border:1px solid var(--line); padding:12px; border-radius:8px; display:flex; align-items:center; justify-content:space-between; }

@media(max-width:640px){
  .form-row, .form-row.three{ grid-template-columns:1fr; }
  .navuser .who{ display:none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   RENT CAR — Single-File Demo Application (2026 Updated)
   ========================================================= */
let uid = 100;
const nextId = (p) => p + '-' + (++uid);

// ตั้งค่าหมายเลขพร้อมเพย์เริ่มต้นสำหรับรับเงินจริง (สามารถเปลี่ยนเป็นเบอร์ของคุณได้)
const PROMPTPAY_NUMBER = "0800000000"; 

const state = {
  ui:{ tab:'cars', authMode:'login', bookingCarId:null, trackingContractId:null },
  currentUser:null,
  users:[
    { id:'u-1', name:'ผู้ดูแลระบบ', email:'admin@gmail.com', password:'admin123', phone:'0800000000', idCard:'1234567890123', role:'admin', isNewMember:false, joinedAt:'2024-01-01' }
  ],
  cars:[
    { id:'c-1', brand:'Toyota', model:'Yaris Ativ', year:2023, plate:'1กก 4521', category:'อีโค่คาร์', seats:5, transmission:'ออโต้', fuel:'เบนซิน', pricePerDay:1200, status:'available', shape:'sedan', color:'#5AAAFF', image:'' },
    { id:'c-2', brand:'Honda', model:'City', year:2023, plate:'2ขค 8834', category:'ซีดาน', seats:5, transmission:'ออโต้', fuel:'เบนซิน', pricePerDay:1400, status:'available', shape:'sedan', color:'#3ECF8E', image:'' },
    { id:'c-3', brand:'Toyota', model:'Fortuner', year:2022, plate:'3งจ 1190', category:'เอสยูวี', seats:7, transmission:'ออโต้', fuel:'ดีเซล', pricePerDay:2800, status:'available', shape:'suv', color:'#FF9A4D', image:'' }
  ],
  bookings:[],
  contracts:[],
  payments:[],
  promotions:[
    { id:'p1', code:'WEEKLY10', name:'เช่ายาว 7 วันขึ้นไป', desc:'ลดทันที 10% เมื่อเช่ารถตั้งแต่ 7 วันขึ้นไป', type:'percent', value:10, rule:(ctx)=> ctx.days>=7 },
    { id:'p2', code:'NEWMEMBER300', name:'สมาชิกใหม่', desc:'ลด 300 บาท สำหรับการจองครั้งแรกของสมาชิกใหม่', type:'fixed', value:300, rule:(ctx)=> ctx.isNewMember && ctx.isFirstBooking }
  ],
  locations:['สาขาสนามบินสุวรรณภูมิ','สาขาสนามบินดอนเมือง','สาขาสีลม กรุงเทพฯ','สาขาเชียงใหม่','สาขาภูเก็ต']
};

/* ============================================================
   ZONE HELPERS
   ============================================================ */
function el(html){
  const d=document.createElement('div');
  d.innerHTML=html.trim();
  if(d.children.length===1) return d.firstElementChild;
  d.style.display='contents';
  return d;
}
function money(n){ return Number(n).toLocaleString('th-TH', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('th-TH',{day:'2-digit',month:'short',year:'numeric'}); }
function toast(msg, isErr){
  const t=el(`<div class="toast ${isErr?'err':''}">${msg}</div>`);
  document.getElementById('toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(),300); }, 3200);
}
function setTab(tab){ state.ui.tab=tab; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function requireLogin(){
  if(!state.currentUser){ toast('กรุณาเข้าสู่ระบบก่อนใช้งานส่วนนี้', true); setTab('auth'); return false; }
  return true;
}
function statusLabel(s){
  return {available:'ว่าง', reserved:'จองแล้ว', rented:'ถูกเช่า', maintenance:'ซ่อมบำรุง'}[s] || s;
}
function contractStatusLabel(s){
  return {pending_payment:'รอชำระเงิน', active:'กำลังเช่า', closed:'คืนรถแล้ว'}[s] || s;
}
function daysBetween(d1,d2){
  const a=new Date(d1+'T00:00:00'), b=new Date(d2+'T00:00:00');
  return Math.round((b-a)/86400000);
}

function carIcon(shape, color){
  const c = color || '#F2F3F4';
  const body = {
    sedan:`<path d="M6 42 L12 42 L16 30 Q19 24 28 24 L52 24 Q60 24 63 30 L67 42 L73 42 L73 46 L6 46 Z" fill="${c}" opacity="0.92"/>
           <path d="M22 30 L27 24 L52 24 L57 30 Z" fill="#14171A" opacity=".35"/>
           <circle cx="20" cy="46" r="6" fill="#14171A"/><circle cx="20" cy="46" r="2.4" fill="${c}"/>
           <circle cx="60" cy="46" r="6" fill="#14171A"/><circle cx="60" cy="46" r="2.4" fill="${c}"/>`,
    suv:`<path d="M5 42 L10 42 L13 26 Q15 20 24 20 L56 20 Q64 20 67 26 L70 42 L75 42 L75 47 L5 47 Z" fill="${c}" opacity="0.92"/>
         <path d="M20 26 L24 20 L56 20 L60 26 Z" fill="#14171A" opacity=".35"/>
         <circle cx="20" cy="47" r="6.5" fill="#14171A"/><circle cx="20" cy="47" r="2.6" fill="${c}"/>
         <circle cx="60" cy="47" r="6.5" fill="#14171A"/><circle cx="60" cy="47" r="2.6" fill="${c}"/>`,
    pickup:`<path d="M4 42 L10 42 L13 28 Q15 22 23 22 L38 22 L38 42 Z" fill="${c}" opacity="0.92"/>
            <path d="M20 28 L23 22 L38 22 L38 28 Z" fill="#14171A" opacity=".35"/>
            <rect x="40" y="30" width="34" height="12" fill="${c}" opacity="0.92"/>
            <circle cx="18" cy="46" r="6" fill="#14171A"/><circle cx="18" cy="46" r="2.4" fill="${c}"/>
            <circle cx="62" cy="46" r="6" fill="#14171A"/><circle cx="62" cy="46" r="2.4" fill="${c}"/>`,
    van:`<path d="M4 20 L58 20 Q68 20 70 30 L74 42 L4 42 Z" fill="${c}" opacity="0.92"/>
         <path d="M10 24 L10 38 M22 24 L22 38 M34 24 L34 38" stroke="#14171A" stroke-opacity=".3" stroke-width="2"/>
         <circle cx="18" cy="46" r="6.5" fill="#14171A"/><circle cx="18" cy="46" r="2.6" fill="${c}"/>
         <circle cx="60" cy="46" r="6.5" fill="#14171A"/><circle cx="60" cy="46" r="2.6" fill="${c}"/>`
  }[shape] || '';
  return `<svg viewBox="0 0 80 54" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

function gaugeSvg(value,total,color){
  const r=22, c=2*Math.PI*r;
  const pct = total>0 ? value/total : 0;
  const off = c*(1-pct);
  return `<svg width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 26 26)"/>
  </svg>`;
}

/* ============================================================
   RENDER: NAV
   ============================================================ */
function renderNav(){
  const tabs = [
    {id:'cars', label:'รถทั้งหมด'},
    {id:'booking', label:'จองรถ'},
    {id:'contracts', label:'สัญญาเช่า'},
    {id:'payments', label:'ชำระเงิน'},
    {id:'promotions', label:'โปรโมชั่น'},
  ];
  if(state.currentUser && state.currentUser.role==='admin') tabs.push({id:'admin', label:'จัดการรถ'});

  const tabsHtml = tabs.map(t=>`<button class="navtab ${state.ui.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');

  const userHtml = state.currentUser
    ? `<div class="navuser">
         <span class="who">สวัสดี, <b>${state.currentUser.name}</b>${state.currentUser.role==='admin'?' (แอดมิน)':''}</span>
         <button class="btn btn-ghost btn-sm" id="logoutBtn">ออกจากระบบ</button>
       </div>`
    : `<div class="navuser"><button class="btn btn-primary btn-sm" id="loginNavBtn">เข้าสู่ระบบ</button></div>`;

  const nav = el(`
    <div class="signpost">
      <div class="signpost-inner">
        <div class="brand"><span class="plate-dot"></span> Rent Car <span style="color:var(--text-faint);font-weight:400;font-size:13px;">เช่ารถออนไลน์</span></div>
        <div class="navtabs">${tabsHtml}</div>
        ${userHtml}
      </div>
    </div>`);
  nav.querySelectorAll('.navtab').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
  const logoutBtn = nav.querySelector('#logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', ()=>{ state.currentUser=null; toast('ออกจากระบบแล้ว'); setTab('cars'); });
  const loginNavBtn = nav.querySelector('#loginNavBtn');
  if(loginNavBtn) loginNavBtn.addEventListener('click', ()=> setTab('auth'));
  return nav;
}

/* ============================================================
   1) ระบบสมาชิก & การเข้าสู่ระบบ (ปรับปรุงการตรวจสอบข้อมูล)
   ============================================================ */
function renderAuth(){
  const wrap = el(`<div class="wrap"><div class="auth-wrap"></div></div>`);
  const box = wrap.querySelector('.auth-wrap');
  const mode = state.ui.authMode;

  box.appendChild(el(`
    <div class="auth-toggle">
      <button data-m="login" class="${mode==='login'?'active':''}">เข้าสู่ระบบ</button>

    </div>`));
  box.querySelectorAll('.auth-toggle button').forEach(b=> b.addEventListener('click', ()=>{ state.ui.authMode=b.dataset.m; render(); }));

  box.appendChild(panel);

  if(mode==='login'){
    panel.appendChild(el(`
      <h3 style="margin-top:0;">เข้าสู่ระบบสมาชิก</h3>
      <div class="form-row single"><div><label>อีเมล (ต้องลงท้ายด้วย @gmail.com)</label><input type="email" id="loginEmail" placeholder="example@gmail.com"></div></div>
      <div class="form-row single"><div><label>รหัสผ่าน</label><input type="password" id="loginPass" placeholder="••••••••"></div></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%;margin-top:6px;">เข้าสู่ระบบ</button>
      <p class="hint" style="margin-top:14px;">ทดลองบัญชีแอดมิน: <b>admin@gmail.com</b> / <b>admin123</b></p>
    `));
    panel.querySelector('#loginBtn').addEventListener('click', ()=>{
      const email=panel.querySelector('#loginEmail').value.trim().toLowerCase();
      const pass=panel.querySelector('#loginPass').value;

      if(!email.endsWith('@gmail.com')){
        toast('อีเมลเข้าสู่ระบบต้องลงท้ายด้วย @gmail.com เท่านั้น', true);
        return;
      }

      const u = state.users.find(u=>u.email.toLowerCase()===email && u.password===pass);
      if(!u){ toast('อีเมลหรือรหัสผ่านไม่ถูกต้อง', true); return; }
      state.currentUser=u; toast('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับ '+u.name); setTab('cars');
    });
  } else {
    panel.appendChild(el(`
      <h3 style="margin-top:0;">สมัครสมาชิกใหม่</h3>
      <div class="form-row"><div><label>ชื่อ-นามสกุล</label><input type="text" id="regName"></div>
      <div><label>เบอร์โทรศัพท์ (10 หลัก)</label><input type="tel" id="regPhone" placeholder="08xxxxxxxx" maxlength="10"></div></div>
      <div class="form-row"><div><label>อีเมล (ต้องใช้ @gmail.com)</label><input type="email" id="regEmail" placeholder="name@gmail.com"></div>
      <div><label>เลขบัตรประชาชน (13 หลัก)</label><input type="text" id="regIdCard" placeholder="1234567890123" maxlength="13"></div></div>
      <div class="form-row single"><div><label>รหัสผ่าน</label><input type="password" id="regPass"></div></div>
      <button class="btn btn-primary" id="regBtn" style="width:100%;margin-top:6px;">สมัครสมาชิก</button>
    `));
    panel.querySelector('#regBtn').addEventListener('click', ()=>{
      const name=panel.querySelector('#regName').value.trim();
      const phone=panel.querySelector('#regPhone').value.trim();
      const email=panel.querySelector('#regEmail').value.trim();
      const idCard=panel.querySelector('#regIdCard').value.trim();
      const pass=panel.querySelector('#regPass').value;
      
      if(!name||!phone||!email||!idCard||!pass){ toast('กรุณากรอกข้อมูลให้ครบถ้วน', true); return; }
      
      // Validation เบอร์โทร 10 ตัวพอดี
      if(!/^\d{10}$/.test(phone)){
        toast('เบอร์โทรศัพท์ต้องเป็นตัวเลขความยาว 10 หลักพอดี', true);
        return;
      }
      
      // Validation เลขบัตร ปชช 13 ตัวพอดี
      if(!/^\d{13}$/.test(idCard)){
        toast('เลขบัตรประชาชนต้องเป็นตัวเลขความยาว 13 หลักพอดี', true);
        return;
      }

      // Validation อีเมล @gmail.com
      if(!email.toLowerCase().endsWith('@gmail.com')){
        toast('อีเมลที่ใช้สมัครต้องลงท้ายด้วย @gmail.com เท่านั้น', true);
        return;
      }

      if(state.users.some(u=>u.email.toLowerCase()===email.toLowerCase())){ toast('อีเมลนี้ถูกใช้งานแล้ว', true); return; }
      
      const u = { id:nextId('u'), name, phone, email, idCard, password:pass, role:'customer', isNewMember:true, joinedAt: new Date().toISOString().slice(0,10) };
      state.users.push(u); state.currentUser=u;
      toast('สมัครสมาชิกสำเร็จ! ยินดีต้อนรับสู่ Rent Car');
      setTab('cars');
    });
  }
  return wrap;
}

/* ============================================================
   2) รายการรถรถ (ปรับปรุงให้แสดงภาพถ่ายรถได้)
   ============================================================ */

      : carIcon(car.shape, car.color);

    const card = el(`
      <div class="car-card">
        <div class="car-top">
          <div class="status-chip status-${car.status}"><span class="dot"></span>${statusLabel(car.status)}</div>
          <div class="plate">${car.plate}</div>

        </div>
        <div class="car-body">
          <h3>${car.brand} ${car.model} <span style="color:var(--text-faint);font-weight:400;font-size:13px;">'${String(car.year).slice(-2)}</span></h3>
          <div class="car-meta">
            <span class="tag">${car.category}</span>

          </div>
          <div class="car-price">
            <div><span class="amt">฿${money(car.pricePerDay)}</span> <span class="per">/วัน</span></div>
          </div>
          <div class="car-actions">
            <button class="btn btn-primary btn-sm" style="flex:1;" data-book="${car.id}" ${car.status!=='available'?'disabled':''}>จองคันนี้</button>
          </div>
        </div>

  });

  wrap.querySelectorAll('[data-book]').forEach(b=> b.addEventListener('click', ()=>{

    state.ui.bookingCarId = b.dataset.book;
    setTab('booking');

/* ============================================================
   3) ระบบการจอง
   ============================================================ */
function computePromotions(user, days){
  const isFirstBooking = user ? state.bookings.filter(b=>b.userId===user.id).length===0 : false;
  const ctx = { days, isNewMember: user? user.isNewMember : false, isFirstBooking };
  return state.promotions.filter(p=>p.rule(ctx)).map(p=>({...p, ctx}));
}

function renderBooking(){
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="pagehead">
      <h1>จองรถ</h1>
      <p>เลือกวันเวลาและสถานที่รับ-คืนรถ ระบบจะคำนวณราคาให้อัตโนมัติ</p>
    </div>`));

  if(!state.currentUser){
    wrap.appendChild(el(`<div class="panel"><p style="margin:0;color:var(--text-muted);">กรุณา <a href="#" id="goLogin">เข้าสู่ระบบ</a> ก่อนทำการจองรถ</p></div>`));
    wrap.querySelector('#goLogin').addEventListener('click',(e)=>{ e.preventDefault(); setTab('auth'); });
    return wrap;
  }

  const availableCars = state.cars.filter(c=> c.status==='available' || c.id===state.ui.bookingCarId);
  if(availableCars.length===0){
    wrap.appendChild(el(`<div class="empty">ขณะนี้ไม่มีรถว่างให้บริการ กรุณาลองใหม่ภายหลัง</div>`));
    return wrap;
  }
  let selectedId = state.ui.bookingCarId && availableCars.some(c=>c.id===state.ui.bookingCarId) ? state.ui.bookingCarId : availableCars[0].id;

  const panel = el(`<div class="panel"></div>`);
  const carOptions = availableCars.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${c.brand} ${c.model} — ฿${money(c.pricePerDay)}/วัน ${c.status!=='available'?'(ไม่ว่าง)':''}</option>`).join('');
  const locOptions = state.locations.map(l=>`<option value="${l}">${l}</option>`).join('');
  const today = new Date().toISOString().slice(0,10);

  panel.appendChild(el(`
    <div class="form-row single"><div><label>เลือกรถ</label><select id="bkCar">${carOptions}</select></div></div>
    <div class="form-row">
      <div><label>วันที่รับรถ</label><input type="date" id="bkPickupDate" min="${today}" value="${today}"></div>
      <div><label>เวลารับรถ</label><input type="time" id="bkPickupTime" value="10:00"></div>
    </div>
    <div class="form-row">
      <div><label>สถานที่รับรถ</label><select id="bkPickupLoc">${locOptions}</select></div>
      <div><label>สถานที่คืนรถ</label><select id="bkReturnLoc">${locOptions}</select></div>
    </div>
    <div class="form-row">
      <div><label>วันที่คืนรถ</label><input type="date" id="bkReturnDate" min="${today}" value="${today}"></div>
      <div><label>เวลาคืนรถ</label><input type="time" id="bkReturnTime" value="10:00"></div>
    </div>
    <div id="bkResult"></div>
  `));
  wrap.appendChild(panel);

  function refreshResult(){
    const carId = panel.querySelector('#bkCar').value;
    const car = state.cars.find(c=>c.id===carId);
    const pDate = panel.querySelector('#bkPickupDate').value;
    const rDate = panel.querySelector('#bkReturnDate').value;
    const resultBox = panel.querySelector('#bkResult');
    resultBox.innerHTML='';

    if(car.status!=='available'){
      resultBox.appendChild(el(`<div class="error-box">รถคันนี้ไม่พร้อมให้บริการในขณะนี้</div>`));
      resultBox.appendChild(el(`<button class="btn btn-primary" disabled style="width:100%;">ไม่สามารถจองได้</button>`));
      return;
    }
    const days = daysBetween(pDate, rDate);
    if(!pDate || !rDate || days<1){
      resultBox.appendChild(el(`<div class="error-box">กรุณาเลือกวันคืนรถหลังวันรับรถอย่างน้อย 1 วัน</div>`));
      return;
    }
    const base = days*car.pricePerDay;
    const promos = computePromotions(state.currentUser, days);
    let discount=0;
    const promoRows = promos.map(p=>{
      const amt = p.type==='percent' ? Math.round(base*p.value/100) : p.value;
      discount += amt;
      return `<div class="brow"><span>🎁 ${p.name}</span><span class="minus">-฿${money(amt)}</span></div>`;
    }).join('');
    const total = Math.max(0, base-discount);

    resultBox.appendChild(el(`
      <div class="breakdown">
        <div class="brow"><span>${car.brand} ${car.model} × ${days} วัน</span><span>฿${money(base)}</span></div>
        ${promoRows || `<div class="brow"><span style="color:var(--text-faint);">ไม่มีโปรโมชั่น</span><span></span></div>`}
        <div class="brow total"><span>ยอดชำระรวม</span><span class="num">฿${money(total)}</span></div>
      </div>
      <button class="btn btn-primary" id="confirmBookBtn" style="width:100%;margin-top:14px;">ยืนยันการจอง</button>
    `));

    resultBox.querySelector('#confirmBookBtn').addEventListener('click', ()=>{
      const pLoc = panel.querySelector('#bkPickupLoc').value;
      const rLoc = panel.querySelector('#bkReturnLoc').value;
      const pTime = panel.querySelector('#bkPickupTime').value;
      const rTime = panel.querySelector('#bkReturnTime').value;

      const booking = {
        id:nextId('bk'), userId:state.currentUser.id, carId:car.id,
        pickupDate:pDate, pickupTime:pTime, pickupLocation:pLoc,
        returnDate:rDate, returnTime:rTime, returnLocation:rLoc,
        days, basePrice:base, discount, total,
        status:'confirmed', createdAt:new Date().toISOString()
      };
      state.bookings.push(booking);
      car.status='reserved';
      if(promos.some(p=>p.code==='NEWMEMBER300')) state.currentUser.isNewMember=false;

      const deposit = 1000;
      const contract = {
        id:nextId('ct'), bookingId:booking.id, carId:car.id, userId:state.currentUser.id,
        customerName:state.currentUser.name, customerPhone:state.currentUser.phone, customerIdCard:state.currentUser.idCard,
        deposit, rentalStart:pDate, rentalEnd:rDate, pickupLocation:pLoc, total,
        status:'pending_payment', createdAt:new Date().toISOString()
      };
      state.contracts.push(contract);

      toast('จองรถสำเร็จ! ระบบได้สร้างสัญญาเช่าแล้ว กรุณาชำระเงิน');
      state.ui.bookingCarId=null;
      setTab('contracts');
    });
  }

  panel.querySelectorAll('select, input').forEach(f=> f.addEventListener('input', refreshResult));
  refreshResult();

  return wrap;
}

          ${ct.status==='active' ? `
            <button class="btn btn-sm ${isTracking ? 'btn-ghost' : 'btn-primary'}" data-track="${ct.id}">
              📍 ${isTracking ? 'กำลังติดตามรถ...' : 'ติดตามรถไรเดอร์สไตล์'}

    // Event Listeners สำหรับปุ่มต่างๆ
    const trackBtn = card.querySelector('[data-track]');
    if(trackBtn) {
      trackBtn.addEventListener('click', () => {
        state.ui.trackingContractId = isTracking ? null : ct.id;

    if(closeMapBtn) {

    toast('คืนรถเรียบร้อย ปิดสัญญาเช่าแล้ว');
    render();
  }));

  return wrap;

    const car = state.cars.find(c=>c.id===ct.carId);
    const item = el(`
      <div style="padding:10px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;" data-select="${ct.id}">
        <div style="display:flex;justify-content:space-between;"><b>${ct.id}</b><span class="num" style="color:var(--amber);">฿${money(ct.total)}</span></div>
        <div style="font-size:12.5px;color:var(--text-muted);">${car? car.brand+' '+car.model : ''}</div>
      </div>`);
    list.appendChild(item);
  });
  left.appendChild(list);

  function renderPayForm(){
    const ct = state.contracts.find(c=>c.id===activeContractId);
    right.innerHTML='';
    right.appendChild(el(`<h3 style="margin-top:0;">ชำระเงินสำหรับสัญญา <span class="num">${ct.id}</span></h3>`));
    
    // เจนเนอเรท QR PromptPay จริง ผ่าน API Open Source (สแกนโอนเงินได้จริง)
    const promptPayUrl = `https://promptpay.io/${PROMPTPAY_NUMBER}/${ct.total}.png`;

    right.appendChild(el(`
      <div class="subtabs">
        <button class="subtab active" data-method="qr">📱 ใช้ได้จริง QR PromptPay</button>
        <button class="subtab" data-method="credit">💳 บัตรเครดิต</button>
      </div>
      <div id="methodBody"></div>`));

    let method='qr';
    const methodBody = right.querySelector('#methodBody');

    function complete(methodLabel){
      ct.status='active';
      const car = state.cars.find(c=>c.id===ct.carId);
      if(car) car.status='rented';
      toast(`ชำระเงินสำเร็จด้วย ${methodLabel} สัญญาเช่าเริ่มทำงาน รถถูกเปิดระบบ GPS ติดตามแล้ว`);
      setTab('contracts');
    }

    function drawMethod(){
      methodBody.innerHTML='';
      if(method==='qr'){
        const box = el(`
          <div class="qr-box">
            <img src="${promptPayUrl}" class="qr-image" alt="PromptPay QR Code">
            <div class="num" style="font-size:18px;font-weight:700;color:var(--amber);">฿${money(ct.total)}</div>
            <p class="hint" style="text-align:center;">เปิดแอปธนาคาร สแกนยอดโอนเงินจริงเข้าบัญชีปลายทางได้ทันที เมื่อโอนเสร็จแล้วกดปุ่มด้านล่าง</p>
            <button class="btn btn-primary" id="payNow" style="width:100%;">ฉันโอนเงินเรียบร้อยแล้ว</button>
          </div>`);
        methodBody.appendChild(box);
        methodBody.querySelector('#payNow').addEventListener('click', ()=> complete('QR PromptPay'));
      } else {
        methodBody.appendChild(el(`
          <div class="form-row single"><div><label>หมายเลขบัตร</label><input type="text" id="ccNum" placeholder="xxxx xxxx xxxx xxxx" maxlength="19"></div></div>
          <div class="form-row"><div><label>วันหมดอายุ</label><input type="text" id="ccExp" placeholder="MM/YY" maxlength="5"></div>
          <div><label>CVV</label><input type="text" id="ccCvv" placeholder="xxx" maxlength="3"></div></div>
          <button class="btn btn-primary" id="payNow" style="width:100%;margin-top:6px;">ชำระเงิน ฿${money(ct.total)}</button>`));
        methodBody.querySelector('#payNow').addEventListener('click', ()=>{
          complete('บัตรเครดิต');
        });
      }
    }
    right.querySelectorAll('.subtab').forEach(b=> b.addEventListener('click', ()=>{
      right.querySelectorAll('.subtab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); method=b.dataset.method; drawMethod();
    }));
    drawMethod();
  }

  list.querySelectorAll('[data-select]').forEach(it=> it.addEventListener('click', ()=>{ activeContractId=it.dataset.select; renderPayForm(); }));
  renderPayForm();

  return wrap;
}

/* ============================================================
   6) โปรโมชั่น
   ============================================================ */
function renderPromotions(){
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`<div class="pagehead"><h1>โปรโมชั่น</h1><p>ส่วนลดที่มีในระบบในปัจจุบัน</p></div>`));
  const grid = el(`<div class="grid-cars" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));"></div>`);
  state.promotions.forEach(p=>{
    grid.appendChild(el(`
      <div class="promo-card">
        <h3>✨ ${p.name}</h3>
        <p>${p.desc}</p>
        <div class="promo-badge">${p.type==='percent' ? '-'+p.value+'%' : '-฿'+money(p.value)}</div>
      </div>`));
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ============================================================
   2b) ระบบจัดการรถฝั่งแอดมิน (เพิ่มความสามารถการใส่ URL รูปภาพรถ)
   ============================================================ */
function renderAdmin(){
  const wrap = el(`<div class="wrap"></div>`);
  wrap.appendChild(el(`
    <div class="pagehead">
      <h1>จัดการรถ (แอดมิน)</h1>
      <p>เพิ่ม แก้ไข หรือลบยานพาหนะพร้อมรูปถ่ายออกจากระบบ</p>
    </div>`));

  const addPanel = el(`<div class="panel" style="margin-bottom:20px;"></div>`);
  addPanel.appendChild(el(`<h3 style="margin-top:0;">เพิ่มรถใหม่</h3>`));
  addPanel.appendChild(el(`
    <div class="form-row three">
      <div><label>ยี่ห้อ</label><input type="text" id="nCarBrand" placeholder="Toyota"></div>
      <div><label>รุ่น</label><input type="text" id="nCarModel" placeholder="Yaris"></div>
      <div><label>ปี</label><input type="number" id="nCarYear" value="2025"></div>
    </div>
    <div class="form-row three">
      <div><label>ทะเบียนรถ</label><input type="text" id="nCarPlate" placeholder="1กก 1234"></div>
      <div><label>หมวดหมู่</label><select id="nCarCat"><option>อีโค่คาร์</option><option>ซีดาน</option><option>เอสยูวี</option><option>กระบะ</option></select></div>
      <div><label>ราคา/วัน (บาท)</label><input type="number" id="nCarPrice" value="1200"></div>
    </div>
    <div class="form-row single">
      <div>
        <label>URL รูปภาพรถ (ใส่ลิงก์รูปภาพถ่ายของรถเพื่อแสดงผล)</label>
        <input type="text" id="nCarImage" placeholder="https://images.unsplash.com/... หรือ ปล่อยว่างไว้ใช้ภาพเงา">
      </div>
    </div>
    <div class="form-row three">
      <div><label>จำนวนที่นั่ง</label><input type="number" id="nCarSeats" value="5"></div>
      <div><label>เกียร์</label><select id="nCarTrans"><option>ออโต้</option><option>ธรรมดา</option></select></div>
      <div><label>เชื้อเพลิง</label><select id="nCarFuel"><option>เบนซิน</option><option>ดีเซล</option><option>ไฟฟ้า</option></select></div>
    </div>
    <button class="btn btn-primary" id="addCarBtn">เพิ่มรถเข้าระบบ</button>
  `));
  wrap.appendChild(addPanel);

  addPanel.querySelector('#addCarBtn').addEventListener('click', ()=>{
    const brand=addPanel.querySelector('#nCarBrand').value.trim();
    const model=addPanel.querySelector('#nCarModel').value.trim();
    const plate=addPanel.querySelector('#nCarPlate').value.trim();
    const image=addPanel.querySelector('#nCarImage').value.trim();
    
    if(!brand||!model||!plate){ toast('กรุณากรอก ยี่ห้อ รุ่น และทะเบียนรถ', true); return; }
    
    const shapes = {'อีโค่คาร์':'sedan','ซีดาน':'sedan','เอสยูวี':'suv','กระบะ':'pickup'};
    const cat = addPanel.querySelector('#nCarCat').value;
    
    state.cars.push({
      id:nextId('c'), brand, model, year:Number(addPanel.querySelector('#nCarYear').value)||2025, plate,
      category:cat, seats:Number(addPanel.querySelector('#nCarSeats').value)||5,
      transmission:addPanel.querySelector('#nCarTrans').value, fuel:addPanel.querySelector('#nCarFuel').value,
      pricePerDay:Number(addPanel.querySelector('#nCarPrice').value)||1200, status:'available',
      shape:shapes[cat]||'sedan', color: '#5AAAFF', image: image
    });
    
    toast('เพิ่มรถพร้อมรูปถ่ายเข้าสู่ระบบสำเร็จ');
    render();
  });

  // ตารางแสดงผลฝั่งแอดมิน
  wrap.appendChild(el(`<h3>รายการรถทั้งหมด (${state.cars.length})</h3>`));
  const tbl = el(`<div class="panel"><table>
    <thead><tr><th>รถ</th><th>ทะเบียน</th><th>ราคา/วัน</th><th>สถานะ</th><th>การจัดการ</th></tr></thead>
    <tbody></tbody></table></div>`);
  const tbody = tbl.querySelector('tbody');
  state.cars.forEach(car=>{
    const row = el(`
      <tr>
        <td>${car.brand} ${car.model}</td>
        <td class="num">${car.plate}</td>
        <td class="num">฿${money(car.pricePerDay)}</td>
        <td>
          <select data-status="${car.id}">
            <option value="available" ${car.status==='available'?'selected':''}>ว่าง</option>
            <option value="rented" ${car.status==='rented'?'selected':''}>ถูกเช่า</option>
            <option value="maintenance" ${car.status==='maintenance'?'selected':''}>ซ่อมบำรุง</option>
          </select>
        </td>
        <td><button class="btn btn-danger btn-sm" data-del="${car.id}">ลบ</button></td>
      </tr>`);
    tbody.appendChild(row);
  });
  wrap.appendChild(tbl);

  tbl.querySelectorAll('[data-status]').forEach(s=> s.addEventListener('change', ()=>{
    const car = state.cars.find(c=>c.id===s.dataset.status);
    car.status = s.value;
    toast(`อัปเดตสถานะเป็น ${statusLabel(car.status)}`);
  }));
  
  tbl.querySelectorAll('[data-del]').forEach(d=> d.addEventListener('click', ()=>{
    state.cars = state.cars.filter(c=>c.id!==d.dataset.del);
    toast('ลบรถแล้ว');
    render();
  }));

  return wrap;
}

/* ============================================================
   ROOT RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  app.appendChild(renderNav());

  let page;
  switch(state.ui.tab){
    case 'auth': page = renderAuth(); break;
    case 'booking': page = renderBooking(); break;
    case 'contracts': page = renderContracts(); break;
    case 'payments': page = renderPayments(); break;
    case 'promotions': page = renderPromotions(); break;
    case 'admin':
      page = (state.currentUser && state.currentUser.role==='admin') ? renderAdmin() : renderCars();
      break;
    default: page = renderCars();
  }
  app.appendChild(page);
  app.appendChild(el(`<div class="footer-note">Rent Car Demo 2026 — ข้อมูลจำลองบนหน่วยความจำเบราว์เซอร์</div>`));
}

render();
</script>
</body>
</html>
